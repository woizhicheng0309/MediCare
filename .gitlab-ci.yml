stages:
  - check
  - secret-detection

frontend-check:
  stage: check
  image: node:24
  before_script:
    - corepack enable
  script:
    - cd frontend_react
    - pnpm install --frozen-lockfile
    - pnpm lint
    - pnpm build
  artifacts:
    paths:
      - frontend_react/dist/
    expire_in: 7 days

backend-syntax:
  stage: check
  image: php:8.5-cli
  script:
    - cd backend_laravel
    - find app routes database config bootstrap -name '*.php' -not -path 'bootstrap/cache/*' -print0 | xargs -0 -n 1 php -l

backend-dependencies:
  stage: check
  image: composer:2
  script:
    - cd backend_laravel
    - composer validate --no-check-publish

backend-tests:
  stage: check
  image: php:8.5-cli
  before_script:
    - apt-get update
    - apt-get install -y git unzip libsqlite3-dev libonig-dev libxml2-dev
    - docker-php-ext-install pdo_sqlite mbstring dom xml xmlwriter
    - curl -fsSL https://getcomposer.org/installer -o /tmp/composer-setup.php
    - php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer
    - cd backend_laravel
    - cp .env.example .env
    - composer install --no-interaction --prefer-dist --no-progress
    - php artisan key:generate
    - php artisan jwt:secret
  script:
    - php artisan test

include:
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  SECRET_DETECTION_ENABLED: 'true'

secret_detection:
  stage: secret-detection

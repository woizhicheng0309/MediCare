stages:
  - check
  - secret-detection
  - build
  - deploy

frontend-check:
  stage: check
  image: node:24
  before_script:
    - corepack enable
  script:
    - cd frontend_react
    - pnpm install --frozen-lockfile
    - pnpm lint
    - pnpm build
  artifacts:
    paths:
      - frontend_react/dist/
    expire_in: 7 days

backend-syntax:
  stage: check
  image: php:8.5-cli
  script:
    - cd backend_laravel
    - find app routes database config bootstrap -name '*.php' -not -path 'bootstrap/cache/*' -print0 | xargs -0 -n 1 php -l

backend-dependencies:
  stage: check
  image: composer:2
  script:
    - cd backend_laravel
    - composer validate --no-check-publish

backend-tests:
  stage: check
  image: php:8.5-cli
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git unzip
    - php -m
    - curl -fsSL https://getcomposer.org/installer -o /tmp/composer-setup.php
    - php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer
    - cd backend_laravel
    - cp .env.example .env
    - composer install --no-interaction --prefer-dist --no-progress
    - php artisan key:generate
    - php artisan jwt:secret
  script:
    - php artisan test

include:
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  SECRET_DETECTION_ENABLED: 'true'
  GCP_PROJECT_ID: medicare-19980309
  GCP_REGION: asia-east1
  GCP_REPOSITORY: apps

secret_detection:
  stage: secret-detection

# Shared Docker client and daemon settings for image build jobs.
.docker-build:
  stage: build
  image: docker:29
  services:
    - name: docker:29-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    # Confirm that the job can connect to its Docker daemon.
    - docker info

backend-image-build:
  extends: .docker-build
  script:
    # Backend context includes application code and its runtime configuration.
    - docker build --target prod -t "medicare-backend:$CI_COMMIT_SHA" ./backend_laravel

frontend-image-build:
  extends: .docker-build
  script:
    # The frontend Dockerfile builds React and packages its output with nginx.
    - docker build -t "medicare-frontend:$CI_COMMIT_SHA" ./frontend_react

# Publish images automatically on the protected main branch.
.registry-publish:
  extends: .docker-build
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"'
      when: on_success
      allow_failure: false
    - when: never
  before_script:
    - docker info
    # Pass the Base64 credential through stdin without printing it.
    - |
      printf '%s' "$GCP_SERVICE_ACCOUNT_KEY" |
        docker login \
          -u _json_key_base64 \
          --password-stdin \
          "https://${GCP_REGION}-docker.pkg.dev"

backend-image-publish:
  extends: .registry-publish
  script:
    # Build and push in the same job because each job has its own daemon.
    - IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_REPOSITORY}/backend:${CI_COMMIT_SHA}"
    - docker build --target prod -t "$IMAGE" ./backend_laravel
    - docker push "$IMAGE"

frontend-image-publish:
  extends: .registry-publish
  script:
    - IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_REPOSITORY}/frontend:${CI_COMMIT_SHA}"
    - docker build -t "$IMAGE" ./frontend_react
    - docker push "$IMAGE"

dev-deploy:
  stage: deploy
  image:
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: [""]
  needs:
    - backend-image-publish
    - frontend-image-publish
  resource_group: medicare-dev
  environment:
    name: dev
    url: https://medicare-dev.duckdns.org
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"'
      when: on_success
      allow_failure: false
    - when: never
  before_script:
    - |
      set -eu
      umask 077
      trap 'rm -f /tmp/gcp-ci-key.json' EXIT
      printf '%s' "$GCP_SERVICE_ACCOUNT_KEY" |
        base64 -d > /tmp/gcp-ci-key.json
      gcloud auth activate-service-account \
        --key-file=/tmp/gcp-ci-key.json --quiet
  script:
    - |
      BACKEND_IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_REPOSITORY}/backend:${CI_COMMIT_SHA}"
      FRONTEND_IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_REPOSITORY}/frontend:${CI_COMMIT_SHA}"

      gcloud run jobs update medicare-dev-migration-job \
        --project="$GCP_PROJECT_ID" \
        --region="$GCP_REGION" \
        --image="$BACKEND_IMAGE" \
        --command=/bin/sh \
        --args=/var/www/db-migrate-seed.sh \
        --execute-now --wait --quiet

      gcloud run services update medicare-dev \
        --project="$GCP_PROJECT_ID" \
        --region="$GCP_REGION" \
        --image="$BACKEND_IMAGE" --quiet

      gcloud run services update medicare-frontend-dev \
        --project="$GCP_PROJECT_ID" \
        --region="$GCP_REGION" \
        --image="$FRONTEND_IMAGE" --quiet

prod-deploy:
  extends: dev-deploy
  needs:
    - dev-deploy
  resource_group: medicare-prod
  environment:
    name: prod
    url: https://medicare-prod.duckdns.org
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: false
    - when: never
  script:
    - |
      BACKEND_IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_REPOSITORY}/backend:${CI_COMMIT_SHA}"
      FRONTEND_IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_REPOSITORY}/frontend:${CI_COMMIT_SHA}"

      gcloud run jobs update medicare-prod-migration-job \
        --project="$GCP_PROJECT_ID" \
        --region="$GCP_REGION" \
        --image="$BACKEND_IMAGE" \
        --command=/bin/sh \
        --args=/var/www/db-migrate-seed.sh \
        --execute-now --wait --quiet

      gcloud run services update medicare-prod \
        --project="$GCP_PROJECT_ID" \
        --region="$GCP_REGION" \
        --image="$BACKEND_IMAGE" --quiet

      gcloud run services update medicare-frontend-prod \
        --project="$GCP_PROJECT_ID" \
        --region="$GCP_REGION" \
        --image="$FRONTEND_IMAGE" --quiet

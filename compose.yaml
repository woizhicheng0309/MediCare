name: medicare-local

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: medicare_docker
      MYSQL_USER: medicare
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      # Keep database data when containers are recreated.
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    image: medicare-backend:dev
    build:
      context: .
      dockerfile: backend_laravel/Dockerfile
      target: dev
    environment: &backend_environment
      APP_NAME: MediCare
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8003
      APP_KEY: ${APP_KEY:?Set APP_KEY}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      # Compose resolves service names inside its network.
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: medicare_docker
      DB_USERNAME: medicare
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: sync
    volumes:
      # Bind source and host-installed vendor for immediate local code updates.
      - ./backend_laravel:/var/www
      - ./backend_laravel/docker/entrypoint.d:/docker-entrypoint.d:ro
    ports:
      - "127.0.0.1:8003:8080"
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  # This job must finish successfully before nginx/PHP-FPM starts serving requests.
  migration:
    image: medicare-backend:dev
    environment: *backend_environment
    volumes:
      - ./backend_laravel:/var/www
    command: ["sh", "/var/www/db-migrate-seed.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
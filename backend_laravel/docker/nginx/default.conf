server {
    listen 8080 default_server;
    root /var/www/public;
    charset utf-8;

    # nginx 自己產生的轉址不要帶出容器內部的 port
    absolute_redirect off;

    add_header X-Frame-Options "SAMEORIGIN" always;

    # FPM 的健康檢查，給 liveness probe 用
    location = /ping {
        access_log off;
        fastcgi_pass unix:/run/php-fpm.sock;
        include fastcgi_params;
        # FPM 要收到 SCRIPT_FILENAME 才會比對 ping.path，這個檔案本身不需要存在
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # 擋 . 開頭的檔案，.well-known 除外
    location ~ /\.(?!well-known) {
        deny all;
    }

    # 任何 .php 網址一律 404，PHP 只能透過 @laravel 執行 index.php
    location ~ \.php$ {
        return 404;
    }

    # public/ 下有這個檔案就直接回，沒有就交給 Laravel
    location / {
        try_files $uri @laravel;
    }

    location @laravel {
        fastcgi_pass unix:/run/php-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        # httpoxy：不讓請求的 Proxy 標頭變成 PHP 的 HTTP_PROXY
        fastcgi_param HTTP_PROXY "";
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        # 要比 FPM 的 request_terminate_timeout 60s 長
        fastcgi_read_timeout 65s;
    }
}

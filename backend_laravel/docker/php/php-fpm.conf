[global]
pid = /run/php-fpm.pid
; 寫到 stderr，由 supervisord 轉到容器的 stdout
error_log = /proc/self/fd/2
; Laravel 的 log 一行可能很長，預設 1024 字元會被切斷
log_limit = 8192
daemonize = no

[www]
user = www-data
group = www-data

listen = /run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; 讓 worker 讀得到容器的環境變數，Laravel 的設定都從環境變數來
clear_env = no

; worker 寫到 stderr 的內容（例如 LOG_CHANNEL=stderr）轉進 FPM 的 log，不加前綴
catch_workers_output = yes
decorate_workers_output = no

pm = dynamic
pm.max_children = 128
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 1024

; liveness probe 用，只回 pong。不開 pm.status_path，避免對外露出 worker 狀態
ping.path = /ping
ping.response = pong

; 卡住的請求 60 秒後強制結束，要比 nginx 的 fastcgi_read_timeout 短
request_terminate_timeout = 60s

php_admin_flag[allow_url_fopen] = Off
php_admin_value[memory_limit] = 128M
php_admin_value[post_max_size] = 65M
php_admin_value[upload_max_filesize] = 23M
php_admin_value[max_file_uploads] = 40
php_value[max_execution_time] = 60

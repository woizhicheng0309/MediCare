# 建置 base image，推到 Artifact Registry
# CI 變數：GCP_SERVICE_ACCOUNT_KEY（base64 編碼的 JSON 金鑰）、GCP_REGION、GCP_PROJECT_ID、AR_REPO
# 每月重建：在 GitLab 的 Pipeline schedules 新增排程，見 README

stages:
  - build

build:
  stage: build
  image: docker:29
  services:
    - name: docker:29-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: ""
    IMAGE: ${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPO}/nginx-php
  before_script:
    # 金鑰存成 base64 才能在 GitLab 設成 Masked，Artifact Registry 的 _json_key_base64 直接吃 base64
    - echo "$GCP_SERVICE_ACCOUNT_KEY" | docker login -u _json_key_base64 --password-stdin "https://${GCP_REGION}-docker.pkg.dev"
    # CI 機器是 amd64，arm64 要靠 QEMU 模擬
    - docker run --privileged --rm tonistiigi/binfmt --install arm64
    - docker buildx create --use
  script:
    - TODAY="$(date +%Y%m%d)"
    - docker buildx build --platform linux/amd64,linux/arm64 --provenance=false --target prod --tag "$IMAGE:8.4-$TODAY" --tag "$IMAGE:8.4" --push .
    - docker buildx build --platform linux/amd64,linux/arm64 --provenance=false --target dev --tag "$IMAGE:8.4-dev" --push .
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

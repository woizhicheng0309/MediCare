# React SPA：nginx 只提供靜態檔，找不到的路徑回 index.html，交給 react-router
# /api、/docs、/up 由 Load Balancer 導到 backend，不會進到這裡
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # location 裡沒有 add_header，所以這些 header 每個回應都會帶
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Vite 輸出的檔案，檔名有 hash；找不到要回 404，不能回 index.html
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}

# 檔名有 hash 的快取一年；其他（index.html 等）每次都向伺服器確認，發版後馬上拿到新版
map $uri $cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}
